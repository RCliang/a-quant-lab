        - generic [ref=f2e140]:
          - heading "01 原理" [level=2] [ref=f2e141]:
            - generic [ref=f2e142]: "01"
            - text: 原理
          - generic [ref=f2e143]:
            - paragraph [ref=f2e144]: 双低本质是反转因子——转债市场追涨动量的有效性极差（公开回测年化 −38.4%），而"又便宜、期权费又少"的组合长期有效。公开回测：2017 年以来年化 21.46%、最大回撤 18.16%、夏普 1.44（新浪财经口径）；十年回测年化 15.8% 跑赢沪深300。
            - generic [ref=f2e145]: 下方散点图是当前全市场存续转债的真实快照（东财 push2 板块 b:MK0354，含转股价/溢价率实测字段）：横轴价格、纵轴溢价率、气泡=剩余规模。拖动滑片设定双低阈值与价格带，红色气泡就是"双低池"——策略即在其中等权轮动。
        - generic [ref=f2e146]:
          - heading "02 可量化规则" [level=2] [ref=f2e147]:
            - generic [ref=f2e148]: "02"
            - text: 可量化规则
          - list [ref=f2e150]:
            - listitem [ref=f2e151]:
              - generic [ref=f2e152]: 全市场剔除
              - text: 已公告/满足强赎的转债、正股 ST、评级 B/C、剩余规模 <3000万、剩余期限 <1年、可交换债；进阶过滤：溢价率 >30% 的超高溢价券。
            - listitem [ref=f2e153]:
              - generic [ref=f2e154]: 按双低排序
              - text: 双低 = 价格 + 转股溢价率 × 100（宁稳等价式：2×价格 − 转股价值），升序取前 10~20 只。
            - listitem [ref=f2e155]:
              - generic [ref=f2e156]: 等权持有
              - text: 每周一（或双周）调仓：卖出跌出排名者，换入新晋前十。
            - listitem [ref=f2e157]:
              - generic [ref=f2e158]: 择时过滤
              - text: yyb凌波版：全市场双低均值 <160 才建仓、>190 减仓/空仓（估值高位 = 双杀风险）。
