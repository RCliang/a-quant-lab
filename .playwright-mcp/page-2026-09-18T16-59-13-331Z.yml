        - generic [ref=f2e140]:
          - heading "01 原理" [level=2] [ref=f2e141]:
            - generic [ref=f2e142]: "01"
            - text: 原理
          - generic [ref=f2e143]:
            - paragraph [ref=f2e144]: 低价券策略：只买面值附近的转债，跌不动（债底）、涨得动（期权），依靠下修转股价与回售条款提供保护。BigQuant 回测（<100 元、前 5 只、每 10 日调仓）2018-2025 年化约 9.77%。摊大饼：按双低/低价建池、等权持有 20~50 只、每周或每月轮动，"满仓轮动、多分散"，基准是转债等权指数。
            - generic [ref=f2e145]: 下方回测用全部真实日 K（含期间退市券以缓解幸存者偏差——搜特这类违约券仍在宇宙中，它教会你低价策略的真正风险）。由于公开源缺失溢价率历史，这里是价格轮动；把价格上限调到 150、只数调到 20，体会"摊大饼"的平滑。
        - generic [ref=f2e146]:
          - heading "02 可量化规则" [level=2] [ref=f2e147]:
            - generic [ref=f2e148]: "02"
            - text: 可量化规则
          - list [ref=f2e150]:
            - listitem [ref=f2e151]:
              - generic [ref=f2e152]: 建池
              - text: 价格 <100~103 元（低价版）或按双低/低价排全市场前 20~50 只（摊大饼版）；剔除 ST 正股、B/C 评级、剩余规模过小、已公告强赎。
            - listitem [ref=f2e153]:
              - generic [ref=f2e154]: 等权买入
              - text: 低价版取前 5~10 只；摊大饼版 20~50 只等权（五位数资金 10~20 只，六位数 20~30 只）。
            - listitem [ref=f2e155]:
              - generic [ref=f2e156]: 轮动
              - text: 每 10 个交易日（或每周/每月）重排：跌出池子的换出、新进的换入。
            - listitem [ref=f2e157]:
              - generic [ref=f2e158]: 纪律
              - text: 不择时、不满仓单一行业；YTM>0 优先（即使永远不涨也有正回报）。
