          - list [ref=e441]:
            - listitem [ref=e442]: 适用：单边趋势市（2014-15、2019-21、2024.9 脉冲），趋势越流畅越好。
            - listitem [ref=e443]: 失效：横盘震荡（均线反复缠绕、金叉死叉连打脸）是最大亏损来源——2013、2017、2023 大部分时间都很痛苦。
