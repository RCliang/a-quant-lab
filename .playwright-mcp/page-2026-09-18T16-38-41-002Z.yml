        - generic [ref=e391]:
          - heading "01 原理" [level=2] [ref=e392]:
            - generic [ref=e393]: "01"
            - text: 原理
          - generic [ref=e394]:
            - paragraph [ref=e395]: 短期均线代表近期持仓成本、长期均线代表中期成本。金叉=趋势启动，死叉=趋势结束。本质是趋势跟随：胜率通常只有 50%~55%，靠"赚大亏小"的盈亏比取胜。20/60 组合年换手约 3~8 次，是波段乃至中期策略的骨架。
            - generic [ref=e396]: 社区回测常见教训：MA5/20 这类短线参数"回测年化 30%、实盘亏损 20%"——踩中未来函数、T+1 废单与滑点。本站的回测引擎信号在 T 日收盘计算、T+1 开盘价执行，你可以自己调参验证参数敏感性。
        - generic [ref=e397]:
          - heading "02 可量化规则" [level=2] [ref=e398]:
            - generic [ref=e399]: "02"
            - text: 可量化规则
          - list [ref=e401]:
            - listitem [ref=e402]:
              - generic [ref=e403]: 确认趋势
              - text: 收盘价站上 MA20 且 MA20 上穿 MA60（或自选快/慢线组合）——只用收盘价确认，盘中信号不算数。
            - listitem [ref=e404]:
              - generic [ref=e405]: 买入执行
              - text: 信号次日开盘价买入（本站引擎即按此执行，避免"盘中看到就买"的未来函数）。
            - listitem [ref=e406]:
              - generic [ref=e407]: 持有
              - text: 死叉出现前一直持有；可用"收盘价同时高于两条均线"或均线斜率为正作二次过滤，减少假信号。
            - listitem [ref=e408]:
              - generic [ref=e409]: 卖出
              - text: 快线下穿慢线 → 次日开盘卖出。也可以用 ATR 跟踪止损（如收盘跌破入场价 − 2×ATR20）替代死叉离场。
