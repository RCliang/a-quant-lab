          - text: 转债 5 分钟线 · 日内策略演示（真实分钟数据）
        - generic [ref=f2e140]:
          - heading "01 原理" [level=2] [ref=f2e141]:
            - generic [ref=f2e142]: "01"
            - text: 原理
          - generic [ref=f2e143]:
            - paragraph [ref=f2e144]: 2022 年 8 月新规后：可转债上市首日 +57.3%/−43.3%、次日起 ±20%，首日 ±20%/±30% 两档临停；T+0、无印花税，一买一卖总成本约万 2~万 3。这使日内网格与正股联动成为可能：正股涨停/异动 → 抢买对应转债；或利用高波动设 1%~2% 步长的日内网格，收盘归零持仓。
            - generic [ref=f2e145]: 下方用真实 5 分钟 K 线（腾讯财经 mkline）演示日内均线策略：拖动 MA 参数观察交易信号与胜率变化。注意这是教学演示——日内策略对滑点极其敏感，实盘远比回测难。
        - generic [ref=f2e146]:
          - heading "02 可量化规则" [level=2] [ref=f2e147]:
            - generic [ref=f2e148]: "02"
            - text: 可量化规则
          - list [ref=f2e150]:
            - listitem [ref=f2e151]:
              - generic [ref=f2e152]: 日内网格
              - text: 设定步长（如 1%~2%）低买高卖，T+0 收盘前平仓归零持仓；配合条件单/动态止盈止损。
            - listitem [ref=f2e153]:
              - generic [ref=f2e154]: 正股联动
              - text: 正股涨停或大单异动 → 立即抢买对应转债（"股债联动套利"），吃正股涨不动而转债补涨的差。
            - listitem [ref=f2e155]:
              - generic [ref=f2e156]: 高波动趋势
              - text: 选当日换手率异常放大、价格突破前高的小盘活跃券做日内趋势，5%~6% 涨幅止盈（集思录口径年化超额约 9%）。
            - listitem [ref=f2e157]:
              - generic [ref=f2e158]: 风控铁律
              - text: 避开首日临停妖债与双高债（价格>130 且溢价>50%）；单日亏损达 2% 停手；滑点按 0.1% 以上预估。
