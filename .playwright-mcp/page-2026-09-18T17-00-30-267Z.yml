          - generic [ref=f3e230]:
            - generic [ref=f3e231]: 周频轮动对交易成本与滑点极敏感：趋势轮动策略成本为 0 时年化约 25%，成本千 2 时降到 15.97%、回撤 −36.28%。实测年化差距可达 3~9 个百分点。ETF 佣金要谈到万 1 以下。
            - generic [ref=f3e232]: RPS 变体：用"250 日涨幅全市场百分位 ≥87~90"做入选过滤（欧奈尔 RPS），配合接近 52 周新高，可显著减少假信号。
