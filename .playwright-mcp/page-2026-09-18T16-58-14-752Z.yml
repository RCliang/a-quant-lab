          - list [ref=f2e194]:
            - listitem [ref=f2e195]: 适用：结构性行情（2019-21 赛道牛、2025 科技牛），行业分化越大越好。
            - listitem [ref=f2e196]: 失效：快速轮动的"电风扇"行情（2022-23 一日游）；无绝对动量过滤时熊市满仓挨打。
            - listitem [ref=f2e467]: 近两年行业轮动加速，月度动量有效性下降、部分机构转向周频多因子。
