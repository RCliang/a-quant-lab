        - generic [ref=f2e140]:
          - heading "01 原理" [level=2] [ref=f2e141]:
            - generic [ref=f2e142]: "01"
            - text: 原理
          - generic [ref=f2e143]:
            - paragraph [ref=f2e144]: 每周末对行业 ETF 池按近期涨幅排序，持有前 N 名一周/一月，下周重排。多周期复合版动量分 = R20×20% + R60×30% + R120×30% + R250×20%，持有前 5 名等权。回测 2023.1-2026.6：年化 18.6%（同期沪深300 −2.3%）、最大回撤 −9.2%、夏普 1.28。
            - generic [ref=f2e145]: 券商研报也有反例：东财《基于动量和反转的行业轮动》回测年化仅 6.12%、回撤 −35.23%——动量不是稳赢，参数与执行方式差异巨大，务必自己用下方实验室验证。
        - generic [ref=f2e146]:
          - heading "02 可量化规则" [level=2] [ref=f2e147]:
            - generic [ref=f2e148]: "02"
            - text: 可量化规则
          - list [ref=f2e150]:
            - listitem [ref=f2e151]:
              - generic [ref=f2e152]: 构建 ETF 池
              - text: 12~18 只流动性好的行业 ETF（证券、酒、医药、半导体、新能源车、银行、军工、有色…），剔除规模<2亿的。
            - listitem [ref=f2e153]:
              - generic [ref=f2e154]: 计算动量分
              - text: 每周（或每月）末计算各 ETF 的 N 日收益率（或 R20/R60/R120/R250 复合加权）。
            - listitem [ref=f2e155]:
              - generic [ref=f2e156]: 持有前 N 名
              - text: 等权买入动量最强的 2~5 只；若做绝对动量过滤，动量 ≤0 的名额空仓。
            - listitem [ref=f2e157]:
              - generic [ref=f2e158]: 定期轮动
              - text: 每 5~20 个交易日重排一次，卖出跌出排名的、换入新晋级的；单只 ETF 可加 −10% 止损。
