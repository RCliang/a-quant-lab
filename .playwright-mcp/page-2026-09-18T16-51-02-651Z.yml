        - generic [ref=e657]:
          - heading "01 原理" [level=2] [ref=e658]:
            - generic [ref=e659]: "01"
            - text: 原理
          - generic [ref=e660]:
            - paragraph [ref=e661]: 短线资金的赚钱效应有自我强化与自我衰竭的循环。游资把市场划分为 冰点→启动（混沌）→发酵→高潮→退潮，用四个可回测的日频指标定位阶段，决定"做不做、做什么、上多少仓"。打板/龙头吃发酵-高潮段，低吸吃分歧-修复段，退潮期所有策略都应降仓或空仓。
            - generic [ref=e662]: 下方图表是真实涨停池数据（东财 push2ex 三池，近 80 个交易日），背景色带按调研报告的阈值粗判阶段——对照右下角"昨涨停溢价"：它连续为负时，就是亏钱效应扩散的退潮信号。
        - generic [ref=e663]:
          - heading "02 可量化规则" [level=2] [ref=e664]:
            - generic [ref=e665]: "02"
            - text: 可量化规则
          - list [ref=e667]:
            - listitem [ref=e668]:
              - generic [ref=e669]: 每日收盘后取数
              - text: 涨停家数、炸板率 = 炸板数 ÷ (涨停数 + 炸板数)、连板最高度、昨涨停股今日平均涨幅（溢价）。
            - listitem [ref=e670]:
              - generic [ref=e671]: 定位阶段
              - text: 冰点 = 涨停<30 且 溢价<0 且 高度≤2；发酵 = 涨停>60 且 溢价>0 且 高度抬升；高潮 = 家数峰值 + 高度≥5 + 批量一字；退潮 = 高位板批量断板 + 炸板率>30% + 溢价转负。
            - listitem [ref=e672]:
              - generic [ref=e673]: 按阶段决定仓位
              - text: 冰点：空仓或只低吸超跌龙；启动：轻仓试错低位首板；发酵：主打龙头与一进二；高潮：只卖不买；退潮：严禁接力。
            - listitem [ref=e674]:
              - generic [ref=e675]: 阈值分位数化
              - text: 注册制后涨跌停家数中枢变化、量化占比提升使周期变短——用近 250 日分位数代替绝对阈值更稳。
